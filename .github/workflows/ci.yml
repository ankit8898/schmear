name: ci
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.18.0, 22.x, 24.x, 26.x]
        # Free accounts run 5 macOS jobs at once; with the 2 macos jobs, 4 macOS checks left one queued past the timeout.
        exclude:
          - { os: macos-latest, node: 22.x }
          - { os: macos-latest, node: 24.x }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci && npm run build
      - run: node dist/cli.js --version
      - name: Install the ACP adapters with this Node's npm
        run: node --input-type=module -e 'const m = await import("./src/agents/shared.ts"); console.log(await m.adapterBin("@agentclientprotocol/claude-agent-acp", "claude-agent-acp"))'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/data
      - run: npm run check
  macos:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build && swift test
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ qt6-base-dev libgl-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ./check-floor.sh build/schmear-tray
