name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches package version
        env:
          REF: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$REF"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@11.21.3
      - run: npm ci && npm run check && npm publish --provenance --access public
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A draft until every asset is attached, so releases/latest/download never points at a missing file.
      - run: gh release create "$TAG" --draft --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
  linux-app:
    needs: github-release
    strategy:
      matrix:
        include:
          # The runner sets the glibc and Qt floor the README states; never -latest.
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    timeout-minutes: 20
    env:
      PKG: schmear-tray-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ qt6-base-dev libgl-dev
      - run: cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build linux/build
      - run: ctest --test-dir linux/build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: |
          cmake --install linux/build --prefix "$PKG" --strip
          tar -czf "$PKG.tar.gz" "$PKG"
          sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256"
      - name: Check the glibc and Qt floor the README states
        run: |
          for floor in GLIBC:2.34 Qt:6.4; do
            name=${floor%:*} max=${floor#*:}
            v=$(objdump -T "$PKG/schmear-tray" | grep -o "${name}_[0-9.]*" | cut -d_ -f2 | sort -uV | tail -n 1)
            echo "$name $v"
            if [ -z "$v" ] || ! printf '%s\n%s\n' "$v" "$max" | sort -VC; then
              echo "::error::needs $name '$v', not at or below the README's $max"
              exit 1
            fi
          done
      - run: gh release upload "$TAG" "$PKG.tar.gz" "$PKG.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
  macos-app:
    needs: [github-release, linux-app]
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure signing keychain and notary credentials
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12_PATH="$RUNNER_TEMP/signing.p12"
          P8_PATH="$RUNNER_TEMP/AuthKey.p8"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$P12_PATH"
          security import "$P12_PATH" -P "$MACOS_SIGNING_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          rm -f "$P12_PATH"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # shellcheck disable=SC2046 # one keychain path per line, no spaces on the runner
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          printf '%s\n' "$ASC_PRIVATE_KEY_P8" > "$P8_PATH"
          xcrun notarytool store-credentials schmear-ci \
            --key "$P8_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$P8_PATH"
      - name: Build, notarize, and verify app
        env:
          SCHMEAR_NOTARY_PROFILE: schmear-ci
        run: |
          macos/build.sh
          SPCTL_OUT="$(spctl -a -vv macos/build/Schmear.app 2>&1)"
          echo "$SPCTL_OUT"
          grep -q "Notarized Developer ID" <<< "$SPCTL_OUT"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" macos/build/Schmear.zip --repo "$GITHUB_REPOSITORY" --clobber
      # The tap's cask and formula download from the release, which a draft does not serve.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevin1chun/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Update Homebrew tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          ZIP_SHA256="$(shasum -a 256 macos/build/Schmear.zip | awk '{print $1}')"
          TARBALL_URL="$(npm view "schmear@$VERSION" dist.tarball)"
          TARBALL_SHA256="$(curl -fsSL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')"

          VERSION="$VERSION" SHA="$TARBALL_SHA256" perl -i -pe \
            's/schmear-[0-9][^\/"]*\.tgz/schmear-$ENV{VERSION}.tgz/; s/^(\s*sha256\s+")[^"]+/$1$ENV{SHA}/' \
            tap/Formula/schmear.rb
          VERSION="$VERSION" SHA="$ZIP_SHA256" perl -i -pe \
            's/^(\s*version\s+")[^"]+/$1$ENV{VERSION}/; s/^(\s*sha256\s+")[^"]+/$1$ENV{SHA}/' \
            tap/Casks/schmear.rb

          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/schmear.rb Casks/schmear.rb
          git -C tap commit -m "schmear $VERSION"
          git -C tap push
      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
